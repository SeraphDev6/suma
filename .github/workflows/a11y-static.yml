name: Accessibility phase 1 (static)

# Full-site static analysis of both frontends, mapped to WCAG 2.2 A-AAA.
# Results appear as code scanning annotations (SARIF) and in the job summary.
# Fails only when a finding is not in tools/a11y/static-baseline.json, so existing debt does not
# block PRs; regenerate the baseline with `npm run static -- --update-baseline` in tools/a11y.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      A11Y_REPORT_DIR: a11y-report
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/a11y/package-lock.json

      - name: Install the scanner
        working-directory: tools/a11y
        run: npm ci --no-audit --no-fund

      - name: Scanner unit tests
        working-directory: tools/a11y
        run: npm test

      - name: Static scan (both apps)
        id: scan
        continue-on-error: true
        run: node tools/a11y/static-scan.mjs --fail-on new

      - name: Upload results to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: a11y-report/static.sarif
          category: a11y-static

      - name: Keep the full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-static
          path: |
            a11y-report/static.json
            a11y-report/static.sarif
            a11y-report/static.md

      - name: Fail on findings that are not in the baseline
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::New accessibility findings. See the job summary and the code scanning annotations."
          exit 1
